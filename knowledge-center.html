<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Knowledge Center</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mu:#667085;--bd:#dfe3ec;--ac:#2b5fd9;--ok:#157f4a;--bad:#c0392b;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2a3550;--ac:#6c9bff;--ok:#4cc38a;--bad:#ff7b6b;--warn:#f0b955}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap}header h1{font-size:18px;margin:0;flex:1}
main{max-width:1100px;margin:0 auto;padding:12px}nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
textarea{width:100%}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:22px}.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.item{border-top:1px solid var(--bd);padding:8px 0}.hid{display:none}label{display:block;margin:6px 0 2px;font-size:13px;color:var(--mu)}input[type=text],input[type=password],select{width:100%}
</style></head><body>
<header><h1>🧠 AI Knowledge Center &amp; Session Learning Center</h1><a href="index.html">← Back to the simulator</a></header>
<main>
<div class="card" id="login"><b>Administrator access</b><div class="mu">Enter the administrator key (the <code>LEARNING_ADMIN_KEY</code> variable in Netlify). It is kept only in this browser tab.</div>
<div class="row" style="margin-top:6px"><input type="password" id="key" placeholder="Administrator key" style="max-width:340px"><button class="p" id="go">Connect</button><span id="loginMsg" class="mu"></span></div></div>
<div id="app" class="hid"><nav id="tabs"></nav><div id="view"></div></div>
</main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY=sessionStorage.getItem('kc_key')||'',TAB='overview',BUSY=false;
const TABS=[['overview','Overview'],['add','Add knowledge'],['library','Knowledge library'],['sessions','Session learning'],['sugg','Learning suggestions'],['conn','Knowledge connections'],['status','Status & settings']];
async function api(m,p,b){const r=await fetch('/api/learning/'+p,{method:m,headers:{'Content-Type':'application/json','x-admin-key':KEY},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(r.status===401){logout();throw new Error('Wrong key')}if(r.status===503&&j.error==='admin_not_configured')throw new Error('The administrator key is not configured on the server (set LEARNING_ADMIN_KEY in Netlify and redeploy).');if(!r.ok&&!j.error)throw new Error('Request failed ('+r.status+')');return j}
function logout(){KEY='';sessionStorage.removeItem('kc_key');$('#app').classList.add('hid');$('#login').classList.remove('hid')}
$('#go').onclick=async()=>{KEY=$('#key').value.trim();$('#loginMsg').textContent='Connecting…';try{const o=await api('GET','overview');sessionStorage.setItem('kc_key',KEY);$('#login').classList.add('hid');$('#app').classList.remove('hid');render()}catch(e){$('#loginMsg').textContent=e.message;$('#loginMsg').className='bad'}};
function tabs(){$('#tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===TAB?'on':''}">${t[1]}</button>`).join('')+'<button id="out">Sign out</button>';$('#tabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render()});$('#out').onclick=logout}
const stat=(n,l)=>`<div class="stat"><b>${E(n)}</b><span class="mu">${E(l)}</span></div>`;
const chip=s=>`<span class="tag ${/approved|auto|done|supported/.test(s)?'ok':/rejected|failed/.test(s)?'bad':'warn'}">${E(s)}</span>`;
const CATS=['scenario','sentence','word','definition','policy','procedure','faq','verification','guideline','troubleshooting','escalation','approved response'];
async function render(){tabs();const v=$('#view');v.innerHTML='<div class="mu">Loading…</div>';try{await VIEWS[TAB](v)}catch(e){v.innerHTML='<div class="card bad">'+E(e.message)+'</div>'}}
const VIEWS={
async overview(v){const o=await api('GET','overview');v.innerHTML=`<div class="card"><b>Knowledge</b><div class="grid">${stat(o.knowledge.total,'knowledge entries')}${stat(o.knowledge.approved,'approved')}${stat(o.knowledge.pending,'pending')}${stat(o.knowledge.scenarios,'scenarios')}${stat(o.knowledge.definitions,'definitions')}${stat(o.knowledge.terminology,'terminology records')}</div></div>
<div class="card"><b>Sessions and learning</b><div class="grid">${stat(o.sessions.stored,'sessions stored')}${stat(o.sessions.analyzed,'sessions analysed')}${stat(o.learning.records,'learning records')}${stat(o.learning.approved+o.learning.autoApproved,'approved / auto-approved')}${stat(o.suggestions.pending,'pending suggestions')}${stat(o.learning.pendingValidation,'pending validation')}${stat(o.learning.rejected,'rejected')}${stat(o.learning.gaps,'knowledge gaps')}</div>
<div class="mu" style="margin-top:6px">Last successful learning: ${E(o.lastLearned||'none yet')} · Storage: ${o.persistent?'<span class="ok">persistent (Netlify Blobs)</span>':'<span class="bad">NOT persistent — nothing is being saved permanently</span>'}</div></div>`},
async add(v){v.innerHTML=`<div class="card"><b>Add knowledge</b><div class="mu">Paste a scenario, sentences, words, a definition, a policy, a procedure, an FAQ or an approved response. The engine analyses it before you save.</div>
<label>Title</label><input type="text" id="kt"><label>Category</label><select id="kc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label>For sentences: what do they ask for? (optional)</label><select id="kf"><option value="">Detect automatically</option><option value="origin">Flight origin</option><option value="dest">Flight destination</option><option value="date">Flight date</option><option value="name">Passenger name</option><option value="bkref">Booking reference</option><option value="pax">Passengers</option><option value="bags">Baggage</option><option value="age">Age</option><option value="contact">Contact details</option></select>
<label>Tags (comma separated)</label><input type="text" id="kg"><label>Content</label><textarea id="kx" rows="9" placeholder="Paste text here…"></textarea><div class="row" style="margin-top:8px"><button id="an">Analyze</button><button id="sv">Save as pending</button><button class="p" id="sa">Save and approve</button></div><div id="kres" class="mu" style="margin-top:8px"></div></div>`;
 const body=a=>({title:$('#kt').value,category:$('#kc').value,field:$('#kf').value,tags:$('#kg').value,content:$('#kx').value,approve:a});
 $('#an').onclick=async()=>{const r=await api('POST','analyze-text',{text:$('#kx').value,category:$('#kc').value});const a=r.analysis;$('#kres').innerHTML='<b>Analysis</b><br>Terms: '+(a.terms.map(t=>E(t.term)+' = '+E(t.def)).join('; ')||'none')+'<br>Questions / phrases: '+(a.questions.map(q=>E(q.text)+' → '+E(q.field||'not recognised')).join('; ')||'none')+'<br>Policies / claims (need approval): '+(a.policies.map(E).join(' | ')||'none')+'<br>Steps: '+(a.steps.length)+' · Keywords: '+a.keywords.map(E).join(', ')};
 const save=a=>async()=>{const r=await api('POST','knowledge',body(a));$('#kres').innerHTML=r.ok?'<span class="ok">Saved ('+E(r.entry.status)+').</span>':'<span class="bad">'+E(r.error)+'</span>'};$('#sv').onclick=save(false);$('#sa').onclick=save(true)},
async library(v){const r=await api('GET','knowledge');const draw=()=>{const q=($('#lq')||{value:''}).value.toLowerCase(),c=($('#lc')||{value:''}).value;const items=r.items.filter(e=>(!c||e.category===c)&&(!q||JSON.stringify([e.title,e.content,e.tags]).toLowerCase().includes(q)));$('#ll').innerHTML=items.map(e=>`<div class="item"><b>${E(e.title)}</b> ${chip(e.status)} <span class="tag">${E(e.category)}</span> <span class="mu">v${e.version} · ${E(String(e.updated).slice(0,10))}</span><div class="mu">${E(e.content.slice(0,220))}</div><div class="mu">${(e.analysis&&e.analysis.terms||[]).length} terms · ${(e.analysis&&e.analysis.questions||[]).length} phrases · ${(e.analysis&&e.analysis.policies||[]).length} claims</div><div class="row" style="margin-top:4px"><button data-a="approved" data-id="${e.id}">Approve</button><button data-a="rejected" data-id="${e.id}">Reject</button><button data-e="${e.id}">Edit</button>${e.history&&e.history.length?`<button data-r="${e.id}">Roll back to v${e.history[e.history.length-1].v}</button>`:''}<button data-d="${e.id}">Delete</button></div></div>`).join('')||'<div class="mu">Nothing found.</div>';
  $('#ll').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{await api('PUT','knowledge/'+b.dataset.id,{status:b.dataset.a});render()});$('#ll').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this entry? It will no longer be used.')){await api('DELETE','knowledge/'+b.dataset.d);render()}});
  $('#ll').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const e=r.items.find(x=>x.id===b.dataset.r);await api('POST','knowledge/'+e.id+'/rollback',{v:e.history[e.history.length-1].v});render()});
  $('#ll').querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const e=r.items.find(x=>x.id===b.dataset.e),t=prompt('Title',e.title);if(t==null)return;const c=prompt('Content (editing withdraws approval until you approve again)',e.content);if(c==null)return;await api('PUT','knowledge/'+e.id,{title:t,content:c});render()})};
 v.innerHTML=`<div class="card"><div class="row"><input type="text" id="lq" placeholder="Search knowledge" style="max-width:300px"><select id="lc" style="max-width:200px"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="ll"></div></div>`;$('#lq').oninput=draw;$('#lc').onchange=draw;draw()},
async sessions(v){const [o,s,r]=await Promise.all([api('GET','overview'),api('GET','sessions'),api('GET','records')]);const L=o.learning;v.innerHTML=`<div class="card"><b>Learning statistics</b><div class="grid">${stat(o.sessions.stored,'sessions')}${stat(o.sessions.analyzed,'analysed')}${stat(L.records,'learning records')}${stat(L.verified,'verified (A)')}${stat(L.observed,'observed (B)')}${stat(L.pendingValidation,'pending (C)')}${stat(L.rejected,'rejected (D)')}${stat(L.patterns,'expression patterns')}${stat(L.gaps,'knowledge gaps')}${stat(L.mistakes,'agent mistake types')}</div></div>
<div class="card"><b>Recently analysed sessions</b>${s.items.slice(0,15).map(x=>`<div class="item"><a href="#" data-s="${E(x.sid)}">${E(x.meta.label||x.meta.sit)}</a> · ${E(x.meta.personality)} · ${E(x.meta.diff)} · ${E(x.meta.outcome||'')} · ${x.turns} turns · ${x.analyzed?'<span class="ok">analysed ('+x.learned+' records)</span>':'<span class="warn">queued</span>'} <button data-x="${E(x.sid)}">Delete</button></div>`).join('')||'<div class="mu">No sessions yet.</div>'}<div id="sdet"></div></div>
<div class="card"><b>Learning records</b><div class="row"><select id="rc"><option value="">All categories</option>${['equivalent_question','customer_emotion','agent_mistake','successful_technique','problem_solving','knowledge_gap','policy_statement','terminology','scenario_insight','relationship'].map(c=>`<option>${c}</option>`).join('')}</select><select id="rs"><option value="">All statuses</option>${['observed','auto','approved','pending','rejected'].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="rl"></div></div>`;
 const drawR=async()=>{const q='records?category='+encodeURIComponent($('#rc').value)+'&status='+encodeURIComponent($('#rs').value);const rr=await api('GET',q);$('#rl').innerHTML=rr.items.map(x=>`<div class="item">${chip(x.status)} <span class="tag">${E(x.category)}</span> <span class="tag">class ${E(x.cls)}</span> <span class="mu">${x.count} session(s) · confidence ${x.confidence}</span><div>${E(x.summary)}</div><div class="row"><button data-ra="${x.id}">Approve</button><button data-rr="${x.id}">Reject</button><button data-rd="${x.id}">Delete</button></div></div>`).join('')||'<div class="mu">No records.</div>';
  $('#rl').querySelectorAll('[data-ra]').forEach(b=>b.onclick=async()=>{await api('PUT','records/'+b.dataset.ra,{status:'approved'});drawR()});$('#rl').querySelectorAll('[data-rr]').forEach(b=>b.onclick=async()=>{await api('PUT','records/'+b.dataset.rr,{status:'rejected'});drawR()});$('#rl').querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this record?')){await api('DELETE','records/'+b.dataset.rd);drawR()}})};
 $('#rc').onchange=drawR;$('#rs').onchange=drawR;drawR();
 v.querySelectorAll('[data-s]').forEach(a=>a.onclick=async e=>{e.preventDefault();const d=await api('GET','sessions/'+a.dataset.s);$('#sdet').innerHTML='<div class="item"><b>Redacted transcript</b>'+d.session.turns.map(t=>'<div><b>'+(t.r==='A'?'Agent':'Customer')+':</b> '+E(t.t)+(t.emo!=null?' <span class="mu">(emotion '+t.emo+')</span>':'')+'</div>').join('')+'</div>'});
 v.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this session and its learning contribution?')){await api('DELETE','sessions/'+b.dataset.x);render()}})},
async sugg(v){const r=await api('GET','suggestions');const fields=['origin','dest','date','name','bkref','pax','bags','age','contact'];v.innerHTML='<div class="card"><b>AI learning suggestions</b><div class="mu">Nothing here changes the simulator until you approve it.</div>'+(r.items.map(s=>`<div class="item">${chip(s.status)} <span class="mu">${E(s.kind)} · seen in ${s.count||1} session(s)${s.aiField?' · AI suggests: '+E(s.aiField)+' ('+Math.round((s.aiConf||0)*100)+'%)':''}</span><div>${E(s.text)}</div>${s.status==='pending'?`<div class="row">${s.kind==='knowledge_gap'?`<select data-f="${s.id}"><option value="">Assign to…</option>${fields.map(f=>`<option ${f===s.aiField?'selected':''}>${f}</option>`).join('')}</select>`:''}<button data-ap="${s.id}">Approve</button><button data-rj="${s.id}">Reject</button></div>`:''}</div>`).join('')||'<div class="mu">No suggestions yet.</div>')+'</div>';
 v.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{const f=v.querySelector('[data-f="'+b.dataset.ap+'"]');const x=await api('POST','suggestions/'+b.dataset.ap,{decision:'approve',field:f?f.value:''});if(x.ok===false)alert(x.error==='choose_a_field'?'Choose what this question asks for first.':x.error);render()});v.querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{await api('POST','suggestions/'+b.dataset.rj,{decision:'reject'});render()})},
async conn(v){const r=await api('GET','relations');v.innerHTML='<div class="card"><b>Topics that appear together in real sessions</b>'+(r.concepts.map(c=>`<div class="item">${E(c.a)} ↔ ${E(c.b)} <span class="mu">${c.sessions} session(s)</span></div>`).join('')||'<div class="mu">None yet.</div>')+'</div><div class="card"><b>Suggested relationships between knowledge entries</b>'+(r.knowledge.map(c=>`<div class="item">${E(c.a.title)} ↔ ${E(c.b.title)} <span class="mu">similarity ${c.score}</span></div>`).join('')||'<div class="mu">None yet.</div>')+'</div>'},
async status(v){const [o,s,a]=await Promise.all([api('GET','overview'),api('GET','settings'),api('GET','audit')]);v.innerHTML=`<div class="card"><b>Synchronization and system status</b><div class="mu">Storage: ${o.persistent?'<span class="ok">persistent — saved online and shared by every device</span>':'<span class="bad">not persistent</span>'}<br>Jobs — queued ${o.sessions.queued} · processing ${o.sessions.processing} · failed ${o.sessions.failed}<br>Last successful learning: ${E(o.lastLearned||'none yet')}</div><div class="row" style="margin-top:6px"><button id="rj">Retry pending/failed jobs</button><button id="bk">Back up now</button><button id="pg">Apply retention now</button><button id="ex">Export all data (JSON)</button></div><div id="sm" class="mu"></div></div>
<div class="card"><b>Privacy and learning controls</b><label><input type="checkbox" id="cc" ${s.collect?'checked':''}> Collect completed simulation sessions</label><label><input type="checkbox" id="ca" ${s.aiAnalysis?'checked':''}> Allow Gemini to label unrecognised questions (suggestions only)</label><label>Keep sessions for (days)</label><input type="text" id="cr" value="${s.retentionDays}" style="max-width:120px"><div class="row" style="margin-top:6px"><button class="p" id="cs">Save settings</button></div><div class="mu">Sessions are stored redacted (names, booking references, phone numbers, emails and card numbers removed). Deleting a session also removes its contribution to learning records.</div></div>
<div class="card"><b>Audit log</b>${a.items.slice(0,30).map(x=>`<div class="item mu">${E(String(x.ts).slice(0,19).replace('T',' '))} · ${E(x.action)} · ${E(String(x.target).slice(0,40))} · ${E(x.by)}</div>`).join('')||'<div class="mu">No actions yet.</div>'}</div>`;
 const msg=t=>$('#sm').textContent=t;$('#rj').onclick=async()=>{const r=await api('POST','jobs',{});msg('Retried '+r.retried+' job(s).')};$('#bk').onclick=async()=>{const r=await api('POST','backup',{});msg(r.ok?'Backup saved.':'Backup failed.')};$('#pg').onclick=async()=>{const r=await api('POST','purge',{});msg('Purged '+r.purged+' session(s).')};
 $('#ex').onclick=async()=>{const d=await api('GET','export');const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='learning-export.json';l.click()};
 $('#cs').onclick=async()=>{await api('PUT','settings',{collect:$('#cc').checked,aiAnalysis:$('#ca').checked,retentionDays:+$('#cr').value});msg('Settings saved.')}}};
if(KEY){api('GET','overview').then(()=>{$('#login').classList.add('hid');$('#app').classList.remove('hid');render()}).catch(()=>{})}
</script></body></html>
